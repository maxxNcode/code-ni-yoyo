<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>code ni yoyo</title>
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <!-- Highlight.js -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

        <!-- Quill.js for Docs Viewer/Editor -->
        <link
            href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
            rel="stylesheet"
        />
        <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

        <!-- Monaco Editor Loader -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "sans-serif"],
                            mono: ['"Fira Code"', "monospace"],
                        },
                        colors: {
                            gray: {
                                850: "#1f2937",
                                900: "#111827",
                                950: "#0b0f19",
                            },
                        },
                        animation: {
                            "fade-in": "fadeIn 0.3s ease-out forwards",
                            "slide-up":
                                "slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        },
                        keyframes: {
                            fadeIn: {
                                "0%": { opacity: "0" },
                                "100%": { opacity: "1" },
                            },
                            slideUp: {
                                "0%": {
                                    opacity: "0",
                                    transform: "translateY(20px)",
                                },
                                "100%": {
                                    opacity: "1",
                                    transform: "translateY(0)",
                                },
                            },
                        },
                    },
                },
            };
        </script>

        <style>
            body {
                background-color: #0b0f19;
                overflow-x: hidden;
            }

            /* Custom scrollbar */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: rgba(71, 85, 105, 0.3);
                border-radius: 10px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(16, 185, 129, 0.5);
            }

            /* Editor base styles */
            #code-editor {
                tab-size: 4;
            }

            /* Glassmorphism utilities */
            .glass-panel {
                background: rgba(17, 24, 39, 0.7);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }

            .glass-header {
                background: rgba(11, 15, 25, 0.85);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }

            /* Smooth interactivity */
            .btn-hover {
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .btn-hover:hover {
                transform: translateY(-1px);
            }

            .btn-hover:active {
                transform: translateY(1px);
            }

            .list-item-enter {
                animation: fadeIn 0.3s ease-out;
            }

            /* Responsive adjustments */
            @media (max-width: 768px) {
                .sidebar-open #files-column {
                    opacity: 1 !important;
                    transform: translateX(0) !important;
                    pointer-events: auto !important;
                }

                #files-column {
                    position: fixed;
                    left: 0;
                    top: 0;
                    bottom: 0;
                    z-index: 50;
                    transform: translateX(-100%);
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    width: 280px;
                    border-right: 1px solid rgba(51, 65, 85, 0.5);
                    box-shadow: 20px 0 50px rgba(0, 0, 0, 0.5);
                    opacity: 0;
                    pointer-events: none;
                    background: rgba(15, 23, 42, 0.98);
                }

                #code-viewer,
                #code-editor {
                    padding: 1rem !important;
                    font-size: 11px !important;
                }

                #editor-area {
                    width: 100vw !important;
                    max-width: 100vw !important;
                }
            }

            /* Prevent code wrapping and enable horizontal scroll */
            #code-viewer {
                white-space: pre !important;
                word-break: normal !important;
                word-wrap: normal !important;
                display: inline-block;
                min-width: 100%;
            }

            #code-editor {
                white-space: pre !important;
                overflow-x: auto !important;
            }

            /* Highlighting styles */
            .highlight-mark {
                background-color: #fef08a;
                color: #1f2937;
                border-radius: 2px;
                cursor: pointer;
                position: relative;
            }

            .highlight-mark:hover {
                background-color: #fde047;
                outline: 1px solid #eab308;
            }

            .highlight-btn {
                path {
                    stroke-width: 2;
                }
            }

            /* Document Editor Styles */
            #document-editor,
            #document-viewer {
                line-height: 1.6;
                white-space: pre-wrap;
                word-wrap: break-word;
                overflow-wrap: break-word;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                font-size: 14px;
            }

            #document-editor {
                border: 1px solid #e5e7eb;
                outline: none;
                padding: 2rem;
            }

            #document-editor:focus {
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }

            #document-editor p,
            #document-viewer p {
                margin: 0.5em 0;
                min-height: 1.5em;
            }

            #document-editor strong,
            #document-viewer strong {
                font-weight: 700;
            }

            #document-editor em,
            #document-viewer em {
                font-style: italic;
            }

            #document-editor u,
            #document-viewer u {
                text-decoration: underline;
            }

            #document-editor ul,
            #document-viewer ul {
                padding-left: 2em;
                margin: 0.5em 0;
                list-style-type: disc;
            }

            #document-editor ol,
            #document-viewer ol {
                padding-left: 2em;
                margin: 0.5em 0;
                list-style-type: decimal;
            }

            #document-editor li,
            #document-viewer li {
                margin: 0.25em 0;
            }

            #document-viewer {
                background-color: white;
                color: #1f2937;
                padding: 2rem;
            }

            /* Fix selection color for Light Mode Documents */
            #document-mode ::selection,
            #document-mode *::selection {
                background-color: rgba(59, 130, 246, 0.3) !important;
                color: #0f172a !important;
            }

            /* Resizable Sidebar Styles */
            :root {
                --sidebar-width: 280px;
            }

            #files-column {
                width: var(--sidebar-width);
                min-width: 200px;
                max-width: 600px;
            }

            #sidebar-resize-handle {
                width: 5px;
                cursor: col-resize;
                background: transparent;
                border-right: 1px solid rgba(71, 85, 105, 0.3);
                position: relative;
                transition: background-color 0.2s;
                user-select: none;
                -webkit-user-select: none;
            }

            #sidebar-resize-handle:hover,
            #sidebar-resize-handle.resizing {
                background-color: rgba(16, 185, 129, 0.2);
                border-right-color: rgba(16, 185, 129, 0.5);
            }

            @media (max-width: 768px) {
                #sidebar-resize-handle {
                    display: none;
                }
            }
        </style>
    </head>

    <body
        class="text-slate-200 h-screen flex flex-col font-sans overflow-hidden antialiased selection:bg-emerald-500/30 selection:text-emerald-200"
    >
        <!-- Header -->
        <header
            class="glass-header border-b border-slate-800/60 p-3 md:p-4 flex justify-between items-center z-20 shadow-[0_4px_30px_rgba(0,0,0,0.1)] sticky top-0"
        >
            <div class="flex items-center gap-2 md:gap-4">
                <div
                    onclick="showDashboard()"
                    class="cursor-pointer flex items-center gap-2 group"
                >
                    <div
                        class="bg-emerald-500 text-slate-950 font-black px-2 py-1.5 rounded-lg text-sm md:text-base flex items-center justify-center group-hover:scale-105 transition-transform"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2.5"
                                d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
                            ></path>
                        </svg>
                    </div>
                    <h1
                        class="text-base md:text-lg font-bold tracking-tight text-white flex items-baseline gap-1"
                    >
                        code
                        <span
                            class="hidden sm:inline text-[10px] font-medium text-slate-400 uppercase tracking-widest"
                            >ni</span
                        >
                        <span class="text-emerald-400">yoyo</span>
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-2 md:gap-5 text-sm">
                <span class="text-slate-400 hidden lg:inline-block font-medium"
                    >Personal Repository</span
                >
                <button
                    id="btn-show-login"
                    class="btn-hover px-3 md:px-4 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700/50 shadow-sm flex items-center gap-1.5 md:gap-2"
                >
                    <svg
                        class="w-4 h-4 text-emerald-500"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                        ></path>
                    </svg>
                    <span class="hidden sm:inline">Admin</span>
                </button>
                <button
                    id="btn-logout"
                    class="btn-hover px-3 md:px-4 py-1.5 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-md border border-red-500/20 hidden flex items-center gap-1.5 md:gap-2"
                >
                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                        ></path>
                    </svg>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div
            class="flex flex-1 overflow-hidden relative z-10 w-full min-h-0 border-x border-slate-800/30"
        >
            <!-- Dashboard View -->
            <div
                id="dashboard-view"
                class="flex-1 overflow-y-auto bg-[#0a0a0f] relative w-full h-full p-4 md:p-10 pb-24"
            >
                <div
                    class="max-w-7xl mx-auto w-full flex flex-col h-full animate-slide-up"
                >
                    <div
                        class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-10 gap-4 mt-2"
                    >
                        <div class="max-w-full overflow-hidden">
                            <h1
                                class="text-2xl md:text-3xl font-bold tracking-tight mb-1 md:mb-2 text-emerald-400 truncate"
                            >
                                Projects
                            </h1>
                            <p
                                class="text-slate-400 text-xs md:text-sm truncate"
                            >
                                Select a project to access source codes.
                            </p>
                        </div>
                        <div
                            class="flex flex-col sm:flex-row gap-3 w-full md:w-auto overflow-hidden"
                        >
                            <div class="relative w-full md:w-80">
                                <svg
                                    class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                                    ></path>
                                </svg>
                                <input
                                    type="text"
                                    id="input-search-projects"
                                    placeholder="Search projects..."
                                    class="w-full bg-slate-900/80 text-sm pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/50 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 text-slate-200 placeholder-slate-500 transition-all font-medium shadow-inner"
                                />
                            </div>
                            <button
                                onclick="promptCreateProject()"
                                id="btn-dashboard-new-project"
                                class="btn-hover bg-emerald-500 hover:bg-emerald-400 text-white flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all shrink-0 admin-only hidden"
                            >
                                <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="3"
                                        d="M12 4v16m8-8H4"
                                    ></path>
                                </svg>
                                New Project
                            </button>
                        </div>
                    </div>

                    <div
                        id="dashboard-projects-grid"
                        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 md:gap-6 pb-20"
                    >
                        <!-- Projects injected here via JS -->
                    </div>
                </div>
            </div>

            <!-- Editor View -->
            <div
                id="editor-view"
                class="hidden flex flex-1 overflow-hidden w-full relative"
            >
                <!-- Mobile Overlay -->
                <div
                    id="mobile-overlay"
                    class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0"
                    onclick="toggleFiles()"
                ></div>

                <!-- Files Column -->
                <div
                    id="files-column"
                    class="relative md:relative z-[60] md:z-10 opacity-0 md:opacity-100 overflow-hidden shrink-0 bg-slate-900/98 md:bg-slate-900/95 border-none md:border-r border-slate-800/60 flex flex-col transition-all duration-300 h-full shadow-2xl md:shadow-none"
                    style="width: var(--sidebar-width)"
                >
                    <div
                        class="h-14 p-4 border-b border-slate-800/60 flex justify-between items-center bg-slate-800/20 shrink-0"
                    >
                        <h2
                            class="text-sm font-bold text-slate-200 truncate flex items-center gap-2"
                            id="current-project-title"
                        >
                            <svg
                                class="w-4 h-4 text-emerald-400"
                                fill="currentColor"
                                viewBox="0 0 20 20"
                            >
                                <path
                                    d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"
                                ></path>
                            </svg>
                            Files
                        </h2>
                        <div
                            class="flex items-center gap-1.5 hidden admin-only"
                        >
                            <button
                                onclick="promptNewFolder()"
                                class="btn-hover text-slate-500 hover:text-emerald-400 hover:bg-emerald-400/10 p-1.5 rounded-md transition-colors"
                                id="btn-new-folder"
                                title="New Folder"
                            >
                                <svg
                                    class="w-4 h-4 pointer-events-none"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"
                                    ></path>
                                </svg>
                            </button>
                            <button
                                onclick="deleteCurrentProject()"
                                class="btn-hover text-slate-500 hover:text-red-400 hover:bg-red-400/10 p-1.5 rounded-md transition-colors"
                                id="btn-delete-project"
                                title="Delete Project"
                            >
                                <svg
                                    class="w-4 h-4 pointer-events-none"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                    ></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div
                        class="p-3 border-b border-slate-800/60 hidden admin-only bg-slate-800/10"
                        id="container-new-file"
                    >
                        <form id="form-new-file" class="flex gap-2">
                            <input
                                type="text"
                                id="input-file-name"
                                placeholder="filename.js"
                                class="w-full bg-slate-950/50 text-xs px-3 py-2 rounded-md border border-slate-700/50 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 text-slate-200 placeholder-slate-600 transition-all font-mono"
                                required
                            />
                            <button
                                type="submit"
                                class="btn-hover bg-slate-800 hover:bg-emerald-500/20 hover:text-emerald-400 text-slate-400 aspect-square px-2.5 rounded-md text-sm border border-slate-700/50 hover:border-emerald-500/30 flex items-center justify-center"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M12 4v16m8-8H4"
                                    ></path>
                                </svg>
                            </button>
                        </form>
                    </div>

                    <!-- Upload Document File -->
                    <div
                        class="p-3 border-b border-slate-800/60 hidden admin-only bg-slate-800/10"
                    >
                        <button
                            onclick="
                                document
                                    .getElementById('file-upload-input')
                                    .click()
                            "
                            class="w-full btn-hover bg-slate-800 hover:bg-purple-500/20 hover:text-purple-400 text-slate-400 px-3 py-2.5 rounded-md text-sm border border-slate-700/50 hover:border-purple-500/30 flex items-center justify-center gap-2 transition-all"
                        >
                            <svg
                                class="w-4 h-4"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M13 10V3L4 14h7v7l9-11h-7z"
                                ></path>
                            </svg>
                            <span>Upload PDF/DOCX</span>
                        </button>
                        <input
                            type="file"
                            id="file-upload-input"
                            accept=".pdf,.docx"
                            class="hidden"
                            onchange="uploadDocumentFile()"
                        />
                    </div>

                    <div
                        class="flex-1 overflow-y-auto p-2 space-y-1 scroll-smooth"
                        id="files-list"
                    ></div>
                </div>

                <!-- Sidebar Resize Handle -->
                <div id="sidebar-resize-handle" class="hidden md:block"></div>

                <!-- Content Area (Toolbar + Editor/Empty State) -->
                <div class="flex-1 flex flex-col min-w-0 relative h-full">
                    <!-- Editor Toolbar (Always Visible) -->
                    <div
                        class="h-14 bg-[#18181d] border-b border-slate-800/80 flex items-center justify-between px-3 md:px-5 shrink-0 z-10 w-full"
                    >
                        <div
                            class="flex items-center gap-2 md:gap-3 overflow-hidden"
                        >
                            <button
                                id="btn-back-dashboard"
                                onclick="showDashboard()"
                                class="btn-hover text-slate-400 hover:text-emerald-400 p-2 rounded-md hover:bg-slate-800 transition-colors shrink-0"
                                title="Back to Dashboard"
                            >
                                <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M10 19l-7-7m0 0l7-7m-7 7h18"
                                    ></path>
                                </svg>
                            </button>
                            <button
                                id="btn-toggle-files"
                                onclick="toggleFiles()"
                                class="btn-hover text-slate-400 hover:text-emerald-400 p-2 rounded-md hover:bg-slate-800 transition-colors shrink-0"
                                title="Toggle Files"
                            >
                                <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M4 6h16M4 12h16M4 18h7"
                                    ></path>
                                </svg>
                            </button>
                            <div
                                class="hidden md:flex gap-1.5 opacity-50 mx-1 shrink-0"
                            >
                                <div
                                    class="w-2.5 h-2.5 rounded-full bg-red-500/80"
                                ></div>
                                <div
                                    class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"
                                ></div>
                                <div
                                    class="w-2.5 h-2.5 rounded-full bg-emerald-500/80"
                                ></div>
                            </div>
                            <div
                                id="file-indicator"
                                class="flex items-center gap-2 min-w-0 hidden"
                            >
                                <svg
                                    class="w-4 h-4 text-emerald-400/70 shrink-0"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                    ></path>
                                </svg>
                                <span
                                    id="current-file-name"
                                    class="font-mono text-xs md:text-sm text-slate-300 truncate"
                                ></span>
                            </div>
                        </div>
                        <div
                            id="file-actions"
                            class="flex items-center gap-1.5 md:gap-2 shrink-0 hidden"
                        >
                            <button
                                onclick="copyCode()"
                                class="btn-hover p-2 md:px-3 md:py-1.5 text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white rounded-md transition-colors flex items-center gap-1.5 border border-slate-700"
                                title="Copy to clipboard"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                                    ></path>
                                </svg>
                                <span class="hidden md:inline">Copy</span>
                            </button>
                            <button
                                onclick="deleteCurrentFile()"
                                class="btn-hover p-2 text-slate-500 hover:text-red-400 hover:bg-red-400/10 rounded-md transition-colors hidden admin-only"
                                id="btn-delete-file"
                                title="Delete File"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                    ></path>
                                </svg>
                            </button>
                            <div
                                class="hidden sm:block w-px h-4 bg-slate-700 mx-1 hidden admin-only self-center"
                            ></div>
                            <button
                                id="btn-edit-toggle"
                                onclick="toggleEditMode()"
                                class="btn-hover p-2 md:px-4 md:py-1.5 text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hover:bg-indigo-500/20 rounded-md transition-all hidden admin-only flex items-center gap-1.5"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                                    ></path>
                                </svg>
                                <span class="hidden md:inline">Edit</span>
                            </button>
                            <button
                                id="btn-highlight"
                                onclick="highlightSelectedText()"
                                class="btn-hover p-2 md:px-4 md:py-1.5 text-xs font-semibold bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 hover:bg-yellow-500/20 rounded-md transition-all hidden flex items-center gap-1.5"
                                title="Select text and click to highlight"
                            >
                                <svg
                                    class="w-4 h-4 highlight-btn"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M9.953 6.5l-3.5 3.5c-.5.5-.5 1.5 0 2l7.5 7.5c.5.5 1.5.5 2 0l3.5-3.5m-4-4l3.5-3.5m-7 11l-3.5-3.5"
                                    ></path>
                                </svg>
                                <span class="hidden md:inline">Highlight</span>
                            </button>
                            <button
                                id="btn-clear-highlight"
                                onclick="clearHighlight()"
                                class="btn-hover p-2 md:px-4 md:py-1.5 text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 rounded-md transition-all hidden flex items-center gap-1.5"
                                title="Clear selected highlight"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"
                                    ></path>
                                </svg>
                                <span class="hidden md:inline">Clear</span>
                            </button>
                            <button
                                id="btn-save"
                                onclick="saveFile()"
                                class="btn-hover p-2 md:px-4 md:py-1.5 text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-white rounded-md transition-all hidden admin-only flex items-center gap-1.5"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"
                                    ></path>
                                </svg>
                                <span class="hidden md:inline">Save</span>
                            </button>
                        </div>
                    </div>

                    <!-- Editor Area (Hidden by default) -->
                    <div
                        class="flex-1 bg-[#1e1e24] flex flex-col hidden relative"
                        id="editor-area"
                    >
                        <!-- Viewing Area -->
                        <div
                            id="view-mode"
                            class="absolute inset-0 overflow-auto bg-[#1e1e24]"
                        >
                            <pre
                                class="m-0 min-h-full min-w-full"
                            ><code id="code-viewer" class="block p-6 text-[13px] leading-relaxed font-mono selection:bg-emerald-500/30"></code></pre>
                        </div>

                        <!-- Editing Area -->
                        <div
                            id="edit-mode"
                            class="flex-1 relative hidden w-full min-w-0"
                        >
                            <div
                                id="code-editor"
                                class="w-full h-full text-left"
                            ></div>
                        </div>

                        <!-- Document Mode (For DOCX) -->
                        <div
                            id="document-mode"
                            class="flex-1 relative hidden w-full flex col min-w-0 bg-white"
                        >
                            <!-- Document Editor (Quill) -->
                            <div
                                id="document-editor-container"
                                class="hidden flex-col h-full absolute inset-0 text-slate-900 bg-white"
                            >
                                <!-- The Quill Toolbar will be dynamically generated by Quill using modules config -->
                                <div
                                    id="document-editor"
                                    class="flex-1 overflow-auto"
                                ></div>
                            </div>

                            <!-- Document Viewer -->
                            <div
                                id="document-viewer"
                                class="absolute inset-0 overflow-auto text-slate-900 bg-white p-6 ql-editor"
                            ></div>
                        </div>

                        <!-- PDF Viewer Mode -->
                        <div
                            id="pdf-mode"
                            class="flex-1 relative hidden w-full h-full bg-[#1e1e24] flex-col"
                        >
                            <iframe
                                id="pdf-viewer"
                                class="w-full h-full border-none shadow-inner"
                                src=""
                            ></iframe>
                        </div>
                    </div>

                    <!-- Empty State (Shown by default) -->
                    <div
                        id="empty-state"
                        class="flex-1 flex items-center justify-center flex-col text-slate-500 relative overflow-hidden"
                    >
                        <!-- Decorative background elements -->
                        <div
                            class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LCAyNTUsIDI1NSwgMC4wNCkiLz48L3N2Zz4=')] opacity-50"
                        ></div>
                        <div
                            class="absolute top-1/2 left-1/2 w-96 h-96 bg-emerald-500/5 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"
                        ></div>

                        <div
                            class="relative z-10 flex flex-col items-center animate-slide-up text-center px-8"
                        >
                            <div
                                class="w-20 h-20 mb-6 rounded-2xl bg-slate-800 border border-slate-700/50 shadow-2xl flex items-center justify-center text-emerald-500/50"
                            >
                                <svg
                                    class="w-10 h-10"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="1.5"
                                        d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
                                    ></path>
                                </svg>
                            </div>
                            <h2
                                class="text-2xl font-bold mb-3 text-slate-200 tracking-tight"
                            >
                                Welcome to code ni yoyo
                            </h2>
                            <p
                                class="text-slate-400 max-w-md mx-auto leading-relaxed"
                            >
                                Select a project from the sidebar to start
                                browsing the code laboratory.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End Editor View -->
        </div>

        <!-- Toast Notification Container -->
        <div
            id="toast-container"
            class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"
        ></div>

        <!-- Login Modal -->
        <div
            id="login-modal"
            class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center hidden z-[100] transition-opacity"
        >
            <div
                class="bg-slate-900 border border-slate-700/60 p-8 rounded-xl shadow-2xl w-full max-w-sm animate-slide-up"
            >
                <div
                    class="w-12 h-12 bg-emerald-500/10 rounded-full flex items-center justify-center text-emerald-500 mb-5 border border-emerald-500/20"
                >
                    <svg
                        class="w-6 h-6"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                        ></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Admin Login</h2>
                <p class="text-sm text-slate-400 mb-6">
                    Authenticate to create and edit projects.
                </p>

                <form id="form-login">
                    <div class="mb-6">
                        <input
                            type="password"
                            id="input-password"
                            placeholder="Enter admin password"
                            class="w-full bg-slate-950/50 text-slate-200 px-4 py-3 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder-slate-600 shadow-inner"
                            required
                        />
                    </div>
                    <div class="flex justify-end gap-3">
                        <button
                            type="button"
                            onclick="
                                document
                                    .getElementById('login-modal')
                                    .classList.add('hidden')
                            "
                            class="btn-hover px-5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                        >
                            Cancel
                        </button>
                        <button
                            type="submit"
                            class="btn-hover px-6 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-white font-medium rounded-lg transition-all"
                        >
                            Authenticate
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Application Logic -->
        <script src="script.js"></script>
    </body>
</html>
